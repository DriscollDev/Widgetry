# CI for Widgetry.
# Source of truth: Engineering Doc §14.1.
# Runs on every PR and push to main.
# E2E (Playwright) is a separate nightly workflow - not yet added.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'

jobs:
  # ---------------------------------------------------------------------------
  # Step 1–4: install, typecheck, lint, unit tests, build.
  # Fast lane - runs without service containers.
  # ---------------------------------------------------------------------------
  static-and-unit:
    name: Static checks, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (ESLint + Prettier)
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Build all apps
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Step 5: integration tests against real Postgres 16 + Redis 7.
  # Versions match Engineering Doc §3.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: static-and-unit

    # All integration runs share one remote ci-test database (Eng Doc §14.1).
    # Queue runs rather than let them collide; never cancel mid-run - an
    # interrupted truncate/migrate poisons the database for the next run.
    concurrency:
      group: integration-tests
      cancel-in-progress: false

    env:
      # ci-test Postgres public proxy URL, path pointing at widgetry_ci_test.
      # Pooled and direct are the same connection in CI (no pooler on the
      # proxy path), so both vars use the same secret.
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      REDIS_URL: ${{ secrets.TEST_REDIS_URL }}
      NODE_ENV: test
      # Throwaway test keys - never reuse outside CI.
      MASTER_ENCRYPTION_KEY: dGVzdC1tYXN0ZXIta2V5LTMyYnl0ZXMtZG8tbm90LXVzZQ==
      BETTER_AUTH_SECRET: ci-test-secret-do-not-use-in-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Guarded reset (Eng Doc §13.2): truncates all application tables and
      # flushes the ci-test Redis. Refuses to run unless the database name
      # ends in `_ci_test`, so a mis-set secret cannot wipe dev or production.
      # Safe on an empty database (no tables → nothing to truncate).
      - name: Reset ci-test database
        run: pnpm --filter @widgetry/db reset

      # The reset step above drops the public + drizzle schemas, so this is not
      # optional: without it the suite runs against an empty database. Enabled
      # now that packages/db/drizzle/0000_init.sql exists.
      - name: Run migrations
        run: pnpm --filter @widgetry/db migrate

      - name: Integration tests
        run: pnpm test:integration
