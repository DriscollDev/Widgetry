# Site metadata
title: Widgetry Wiki
description: >-
  Documentation for Widgetry - an API monitoring dashboard.
  Product guides, capstone deliverables, and design specifications.
author: Pokeballers

# URL config. Custom domain set via CNAME, so baseurl is empty.
# If you ever move off the custom domain to <org>.github.io/<repo>/docs,
# change baseurl to "/<repo>/docs".
url: "" # filled in by Pages
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  toc_levels: 2..3

# We are not using a gem-based theme; layouts live in _layouts/.
theme: ~

# What to keep out of the built site
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Layout defaults per content folder (active/, course/, design/, weeks/).
# Later entries override earlier ones when both match.
defaults:
  - scope:
      path: "active"
    values:
      layout: wiki
      wiki: active
  - scope:
      path: "weeks"
    values:
      layout: week
      wiki: course
  - scope:
      path: "design"
    values:
      layout: wiki
      wiki: design
  - scope:
      path: "course"
    values:
      layout: default
      wiki: course

# Ordered list of weeks used by the nav include and the course home page tiles.
# Edit this when deliverables shift.
weeks:
  - number: 1
    slug: week-01
    title: Project Proposal
    deliverable_kind: markdown
    status: false
  - number: 2
    slug: week-02
    title: Use Case Diagram
    deliverable_kind: image
    status: true
  - number: 3
    slug: week-03
    title: Prototype
    deliverable_kind: external # Figma link
    status: true
  - number: 4
    slug: week-04
    title: Database Design (ERD)
    deliverable_kind: embed # dbdiagram iframe
    status: true
  - number: 5
    slug: week-05
    title: Mid-Term Presentation
    deliverable_kind: slides
    status: true
  - number: 6
    slug: week-06
    title: Activity Diagrams
    deliverable_kind: image
    status: true
  - number: 7
    slug: week-07
    title: Class Diagrams
    deliverable_kind: image
    status: true
  - number: 8
    slug: week-08
    title: Heuristic Evaluation
    deliverable_kind: markdown
    status: true
  - number: 9
    slug: week-09
    title: Gantt Chart
    deliverable_kind: mermaid
    status: true
  - number: 10
    slug: week-10
    title: Final Presentation
    deliverable_kind: slides
    status: false

