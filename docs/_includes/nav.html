<nav class="site-nav" aria-label="Primary">
  <button class="nav-toggle" aria-expanded="false" aria-controls="nav-list">
    <span class="nav-toggle-bar" aria-hidden="true"></span>
    <span class="nav-toggle-bar" aria-hidden="true"></span>
    <span class="nav-toggle-bar" aria-hidden="true"></span>
    <span class="sr-only">Menu</span>
  </button>
  <ul id="nav-list" class="nav-list">
    <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
    <li class="nav-group" aria-haspopup="true">
      <span class="nav-group-label">Weeks</span>
      <ul class="nav-submenu">
        {% for w in site.weeks %}
          <li>
            <a href="{{ '/weeks/' | append: w.slug | append: '/' | relative_url }}">
              <span class="nav-week-num">{{ w.number }}</span>
              <span class="nav-week-title">{{ w.title }}</span>
            </a>
          </li>
        {% endfor %}
      </ul>
    </li>
    {% for link in site.external_links %}
      <li><a class="nav-external" href="{{ link.url }}" rel="noopener">{{ link.label }} ↗</a></li>
    {% endfor %}
  </ul>
</nav>
<script>
  (function () {
    var btn = document.querySelector('.nav-toggle');
    var list = document.getElementById('nav-list');
    if (!btn || !list) return;
    btn.addEventListener('click', function () {
      var open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!open));
      list.classList.toggle('is-open', !open);
    });
  })();
</script>
