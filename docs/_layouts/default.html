<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% else %}<meta name="description" content="{{ site.description }}">{% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">

  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-row">
      <a class="wordmark" href="{{ '/' | relative_url }}">
        <span class="wordmark-sigil" aria-hidden="true">✦</span>
        <span class="wordmark-text">Widgetry</span>
        <span class="wordmark-sub">Capstone Planning</span>
      </a>
      {% include nav.html %}
    </div>
  </header>

  <main id="main" class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="ornament" aria-hidden="true">
        <span class="ornament-rule"></span>
        <span class="ornament-sigil">✦</span>
        <span class="ornament-rule"></span>
      </div>
      <p class="footer-text">
        Widgetry — {{ site.author }} · Capstone Planning Phase, 2026 ·
        <a href="{{ site.external_links | where: 'label', 'GitHub Repo' | map: 'url' | first }}">Source</a>
      </p>
    </div>
  </footer>
</body>
</html>
