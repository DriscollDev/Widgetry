@startuml data_credentials
title Widgetry — Data & Credentials

left to right direction
skinparam packageStyle rectangle
skinparam actorStyle awesome
skinparam shadowing false
skinparam defaultFontName "Helvetica"
skinparam usecase {
  BackgroundColor #E1ECF7
  BorderColor #2A5687
  ArrowColor #2A5687
}
skinparam actor {
  BackgroundColor #FFFFFF
  BorderColor #173404
}

actor "Authenticated\nUser" as User

rectangle "Widgetry" {
  usecase "Configure\nFixed Widget" as ConfigFixed
  usecase "Configure\nCustom JSON\nWidget" as ConfigCustom
  usecase "Save API\nCredential" as SaveCred
  usecase "Delete API\nCredential" as DelCred
  usecase "View Widget\nTimeline" as Timeline
  usecase "Trigger Manual\nWidget Refresh" as ManualRefresh

  usecase "Validate URL\nagainst SSRF\nBlocklist" as SSRF
  usecase "Validate\nJSON Path" as ValidPath
  usecase "Envelope-Encrypt\nCredential" as Encrypt
}

User - -> ConfigFixed
User - -> ConfigCustom
User - -> SaveCred
User - -> DelCred
User - -> Timeline
User - -> ManualRefresh

ConfigCustom ..> SSRF : <<include>>
ConfigCustom ..> ValidPath : <<include>>
SaveCred ..> Encrypt : <<include>>

SaveCred .> ConfigCustom : <<extend>>
DelCred .> ConfigCustom : <<extend>>

note bottom of SSRF
  Rejects RFC1918, loopback,
  link-local, and IPv6 private
  ranges. See Eng Doc §11.3
end note

note bottom of Encrypt
  AES-256-GCM envelope encryption
  with per-record DEK.
  See Eng Doc §10.2
end note

note as N1
  Worker-side polling and snapshot
  storage are system-triggered and
  out of scope for this diagram per
  the "human actors only" convention.
end note

@enduml

