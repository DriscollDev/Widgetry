@startuml lifecycle
title Widgetry — Board & Widget Lifecycle

left to right direction
skinparam packageStyle rectangle
skinparam actorStyle awesome
skinparam shadowing false
skinparam defaultFontName "Helvetica"
skinparam usecase {
  BackgroundColor #E1ECF7
  BorderColor #2A5687
  ArrowColor #2A5687
}
skinparam actor {
  BackgroundColor #FFFFFF
  BorderColor #173404
}

actor "Authenticated\nUser" as User

rectangle "Widgetry" {
  usecase "View Board\nList" as ListBoards
  usecase "Create Board" as CreateBoard
  usecase "View Board" as ViewBoard
  usecase "Rename Board" as RenameBoard
  usecase "Configure Board\nRefresh Mode" as RefreshMode
  usecase "Delete Board" as DelBoard
  usecase "Manually Refresh\nAll Widgets" as RefreshAll

  usecase "Open Widget\nCatalog" as Catalog
  usecase "Add Widget\nto Board" as AddWidget
  usecase "Move Widget" as MoveWidget
  usecase "Resize Widget" as ResizeWidget
  usecase "Delete Widget" as DelWidget

  usecase "Validate\nNo Overlap" as Overlap
  usecase "Cascade Delete\nWidgets &\nSnapshots" as CascadeBoard
  usecase "Configure\nWidget" as ConfigWidget #FFF2CC
}

User - -> ListBoards
User - -> CreateBoard
User - -> ViewBoard
User - -> RenameBoard
User - -> RefreshMode
User - -> DelBoard
User - -> RefreshAll

User - -> Catalog
User - -> AddWidget
User - -> MoveWidget
User - -> ResizeWidget
User - -> DelWidget

DelBoard ..> CascadeBoard : <<include>>
MoveWidget ..> Overlap : <<include>>
ResizeWidget ..> Overlap : <<include>>
AddWidget ..> Overlap : <<include>>
AddWidget ..> ConfigWidget : <<include>>

note bottom of ConfigWidget
  Configuration details
  appear in Diagram 3
  (Data & Credentials)
end note

@enduml

