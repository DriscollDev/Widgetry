@startuml auth
title Widgetry — Authentication & Account Management

left to right direction
skinparam packageStyle rectangle
skinparam actorStyle awesome
skinparam shadowing false
skinparam defaultFontName "Helvetica"
skinparam usecase {
  BackgroundColor #E1ECF7
  BorderColor #2A5687
  ArrowColor #2A5687
}
skinparam actor {
  BackgroundColor #FFFFFF
  BorderColor #173404
}

actor "Visitor" as Visitor
actor "Authenticated\nUser" as AuthUser

rectangle "Widgetry" {
  usecase "Sign Up\n(email + password)" as SignUp
  usecase "Sign In\n(email + password)" as SignIn
  usecase "Authenticate\nvia Google" as Google
  usecase "Verify Email\nAddress" as Verify
  usecase "Request Password\nReset" as ReqReset
  usecase "Complete Password\nReset" as DoReset
  usecase "Sign Out" as SignOut
  usecase "Change Password\n(in session)" as ChangePw
  usecase "View Account\nSettings" as Account
  usecase "Delete Account" as DelAcct

  usecase "Send Verification\nEmail" as SendVerify
  usecase "Send Reset\nEmail" as SendReset
  usecase "Cascade Delete\nOwned Data" as Cascade
}

actor "Google OAuth\nProvider" as GoogleProv
actor "Email Provider\n(Resend)" as Email

Visitor - -> SignUp
Visitor - -> SignIn
Visitor - -> Verify
Visitor - -> ReqReset
Visitor - -> DoReset

AuthUser - -> SignOut
AuthUser - -> ChangePw
AuthUser - -> Account
AuthUser - -> DelAcct

SendVerify - -> Email
SendReset - -> Email
Google - -> GoogleProv

SignUp ..> SendVerify : <<include>>
ReqReset ..> SendReset : <<include>>
DelAcct ..> Cascade : <<include>>

Google .> SignUp : <<extend>>
Google .> SignIn : <<extend>>

@enduml

