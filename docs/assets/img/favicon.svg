<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark violet background, matches the surface tokens -->
  <rect width="64" height="64" rx="10" fill="#1a1729"/>

  <!-- Gold gear ring with eight teeth, simplified from the full logo -->
  <g fill="#d4b454">
    <g transform="translate(32 32)">
      <rect x="-3" y="-28" width="6" height="8" rx="1"/>
      <rect x="-3" y="20" width="6" height="8" rx="1"/>
      <rect x="-28" y="-3" width="8" height="6" rx="1"/>
      <rect x="20" y="-3" width="8" height="6" rx="1"/>
      <g transform="rotate(45)">
        <rect x="-3" y="-28" width="6" height="8" rx="1"/>
        <rect x="-3" y="20" width="6" height="8" rx="1"/>
        <rect x="-28" y="-3" width="8" height="6" rx="1"/>
        <rect x="20" y="-3" width="8" height="6" rx="1"/>
      </g>
    </g>
    <circle cx="32" cy="32" r="20"/>
  </g>

  <!-- Inner violet disc with a gold center, echoing the logo's central eye -->
  <circle cx="32" cy="32" r="14" fill="#2a2540"/>
  <circle cx="32" cy="32" r="4" fill="#d4b454"/>
</svg>
